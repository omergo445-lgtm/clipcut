name: ClipCut Cloud Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space and add up to 34 GB swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile

          ROOT_AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          MNT_AVAIL_GB=$([ -d /mnt ] && df -BG --output=avail /mnt | tail -1 | tr -dc '0-9' || echo 0)

          if mountpoint -q /mnt && [ "$MNT_AVAIL_GB" -ge 36 ]; then
            SWAP_PATH="/mnt/swapfile"
            SWAP_GB=34
          elif [ "$ROOT_AVAIL_GB" -ge 59 ]; then
            SWAP_PATH="/swapfile"
            SWAP_GB=34
          else
            SWAP_PATH="/swapfile"
            SWAP_GB=$((ROOT_AVAIL_GB - 25))
            [ "$SWAP_GB" -lt 8 ] && SWAP_GB=8
          fi

          echo "Creating ${SWAP_GB}G swap at ${SWAP_PATH} (root free: ${ROOT_AVAIL_GB}G, /mnt free: ${MNT_AVAIL_GB}G)"
          sudo fallocate -l "${SWAP_GB}G" "$SWAP_PATH"
          sudo chmod 600 "$SWAP_PATH"
          sudo mkswap "$SWAP_PATH"
          sudo swapon "$SWAP_PATH"
          mkdir -p /tmp/clipcut-cargo-home /tmp/clipcut-target
          free -h
          df -h / /mnt || df -h /

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /tmp/clipcut-cargo-home/registry/index
            /tmp/clipcut-cargo-home/registry/cache
            /tmp/clipcut-cargo-home/git/db
          key: clipcut-cargo-reg-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            clipcut-cargo-reg-

      - name: Cache compiled Arch Rust dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/clipcut-target
          key: clipcut-arch-target-v2-${{ hashFiles('src/Cargo.lock', 'src/Cargo.toml', 'src/patches/i-slint-renderer-skia/**', 'src/patches/whisper-rs-sys/build.rs') }}
          restore-keys: |
            clipcut-arch-target-v2-
            clipcut-arch-target-v1-

      - name: Build ClipCut binary in Arch Linux container
        run: |
          mkdir -p /tmp/clipcut-cargo-home /tmp/clipcut-target
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -v "/tmp/clipcut-cargo-home:/cargo-home" \
            -v "/tmp/clipcut-target:/cargo-target" \
            -w /work \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm base-devel rustup clang cmake ffmpeg fontconfig freetype2 alsa-lib libxkbcommon wayland pkgconf lld git curl
              rustup default stable
              cd /work/src
              export CARGO_HOME=/cargo-home
              export CARGO_TARGET_DIR=/cargo-target
              export CFLAGS="-march=ivybridge"
              export CXXFLAGS="-march=ivybridge"
              export GGML_NATIVE=OFF
              export GGML_SSE42=ON
              export GGML_AVX=ON
              export GGML_F16C=ON
              export GGML_AVX2=OFF
              export GGML_BMI2=OFF
              export GGML_FMA=OFF
              export GGML_AVX512=OFF
              export RUSTFLAGS="-C target-cpu=ivybridge -C link-arg=-fuse-ld=lld"

              if grep -rq 'GGML_FMA:BOOL=ON' /cargo-target/cloud/build/whisper-rs-sys-* 2>/dev/null; then
                rm -rf /cargo-target/cloud/build/whisper-rs-sys-* /cargo-target/cloud/deps/libwhisper_rs*
              fi

              # Build workspace engine crates across all 4 runner vCPUs first
              CARGO_BUILD_JOBS=4 cargo build --profile cloud \
                -p concat-host \
                -p concat-render \
                -p concat-media \
                -p concat-text \
                -p concat-effects \
                -p concat-export \
                -p concat-server

              # Build Slint dependencies + the 970k-line UI binary with bounded concurrency
              CARGO_BUILD_JOBS=2 cargo build --profile cloud --bin concat

              cp /cargo-target/cloud/concat /work/clipcut-bin
              chmod 755 /work/clipcut-bin

              # Prune only the leaf concat UI artifacts so the dependency cache stays compact & warm
              rm -rf \
                /cargo-target/cloud/concat \
                /cargo-target/cloud/concat.d \
                /cargo-target/cloud/libconcat.rlib \
                /cargo-target/cloud/libconcat.d \
                /cargo-target/cloud/deps/concat-* \
                /cargo-target/cloud/deps/libconcat-* \
                /cargo-target/cloud/incremental
            '
          sudo chown -R "$(id -u):$(id -g)" /tmp/clipcut-cargo-home /tmp/clipcut-target
          ls -lh ./clipcut-bin

      - name: Publish rolling release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-clipcut --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-clipcut ./clipcut-bin --repo "${{ github.repository }}" --clobber
          else
            gh release create latest-clipcut ./clipcut-bin \
              --repo "${{ github.repository }}" \
              --title "Latest ClipCut Build" \
              --notes "Built in cloud for Arch Linux (ivybridge)."
          fi
